<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰拉瑞亚 · Terraria Web</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }

  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; image-rendering: pixelated; }

  /* ---------- 加载画面 ---------- */
  #loading {
    position: fixed; inset: 0; background: linear-gradient(180deg, #1a2a52 0%, #3b6ea5 60%, #7ec850 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    transition: opacity .5s;
  }
  #loading h1 {
    color: #fff; font-size: 56px; letter-spacing: 8px; text-shadow: 0 4px 0 #2a4a2a, 0 8px 24px rgba(0,0,0,.5);
    margin-bottom: 8px; font-weight: 900;
  }
  #loading .sub { color: #ffe9a8; font-size: 16px; letter-spacing: 4px; margin-bottom: 40px; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  #loadbar { width: 320px; height: 18px; border: 3px solid #2a4a2a; border-radius: 10px; background: rgba(0,0,0,.35); overflow: hidden; }
  #loadbar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #7ec850, #b8e986); transition: width .2s; }
  #loadtext { color: #fff; margin-top: 12px; font-size: 13px; opacity: .85; }

  /* ---------- 热键栏 ---------- */
  #hotbar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 20; pointer-events: none;
  }
  .slot {
    width: 56px; height: 56px; border-radius: 8px; position: relative;
    background: rgba(20, 22, 34, .72); border: 3px solid rgba(0,0,0,.55);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 4px 10px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
  }
  .slot canvas { width: 38px; height: 38px; image-rendering: pixelated; border-radius: 3px; }
  .slot .num {
    position: absolute; top: 1px; left: 5px; font-size: 11px; color: #cfd6ff; opacity: .8;
    text-shadow: 0 1px 2px #000; font-weight: 700;
  }
  .slot .count {
    position: absolute; bottom: 1px; right: 5px; font-size: 13px; color: #fff; font-weight: 800;
    text-shadow: 0 1px 2px #000, 0 0 4px #000;
  }
  .slot.sel {
    border-color: #ffd94d; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25), 0 0 14px rgba(255,217,77,.75), 0 4px 10px rgba(0,0,0,.4);
    background: rgba(50, 48, 30, .8);
  }

  /* ---------- 操作提示 ---------- */
  #help {
    position: fixed; top: 12px; left: 12px; z-index: 20; color: #eef2ff;
    background: rgba(12, 14, 26, .62); border: 2px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; line-height: 1.75; backdrop-filter: blur(3px);
    text-shadow: 0 1px 2px #000;
  }
  #help b { color: #ffd94d; }
  #help .title { font-size: 14px; font-weight: 800; color: #b8e986; margin-bottom: 2px; }
  #help .dim { opacity: .6; font-size: 12px; }

  /* ---------- 时钟 ---------- */
  #clock {
    position: fixed; top: 12px; right: 14px; z-index: 20; color: #fff; font-size: 14px; font-weight: 700;
    background: rgba(12, 14, 26, .62); border: 2px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 8px 14px; text-shadow: 0 1px 2px #000; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hotbar"></div>
  <div id="clock">☀ 白天</div>

  <div id="help">
    <div class="title">泰拉瑞亚 · 地表世界</div>
    <b>A / D</b> 移动 &nbsp; <b>W / 空格</b> 跳跃<br>
    <b>鼠标左键</b> 挖掘 / 挥剑攻击 &nbsp; <b>右键</b> 放置方块<br>
    <b>1 - 6 / 滚轮</b> 切换方块<br>
    <span class="dim">小心史莱姆！H 隐藏提示 · 昼夜会自动流转</span>
  </div>

  <div id="loading">
    <h1>泰拉瑞亚</h1>
    <div class="sub">TERRARIA · WEB EDITION</div>
    <div id="loadbar"><div></div></div>
    <div id="loadtext">正在生成世界…</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
